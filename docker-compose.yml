services:
  backend:
    build: .
    image: seclog-backend
    environment:
      SECLOG_DB: /data/seclog.db
      SECLOG_ADDR: ":8080"
    volumes:
      - seclog-data:/data
    ports:
      - "8080:8080"
    restart: unless-stopped

  mcp:
    image: seclog-backend
    build: .
    command: ["mcp-server", "-http", ":8081"]
    environment:
      SECLOG_DB: /data/seclog.db
    volumes:
      - seclog-data:/data
    ports:
      - "8081:8081"
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: seclog-frontend
    ports:
      - "8088:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  seclog-data:
